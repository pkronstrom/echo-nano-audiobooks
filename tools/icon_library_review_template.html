<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Echo Nano icons</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:14px system-ui}main{width:max-content;max-width:100%;margin:32px auto;padding:8px}.row{display:grid;grid-template-columns:repeat(7,40px);gap:8px;margin-bottom:12px}button{width:40px;height:36px;padding:0;display:grid;place-items:center;background:#000;border:1px solid transparent;border-radius:5px;cursor:pointer;color:#aaa}button[aria-pressed="true"]{border-color:#79d7b8;background:#14221d}button:hover{background:#202020}button:focus-visible{outline:2px solid #fff;outline-offset:2px}.pixel{display:block;image-rendering:pixelated;width:20px;height:16px}footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}#export{display:none;width:100%;height:140px;margin-top:12px;background:#111;color:#fff;border:1px solid #555}#export.visible{display:block}@media(max-width:360px){.row{grid-template-columns:repeat(7,36px);gap:4px}button{width:36px}}
</style>
<main><div id="grid" aria-label="Choose one icon per row"></div><footer><button id="copy" aria-label="Copy feedback" title="Copy feedback" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"><rect x="5" y="5" width="8" height="9" rx="1"/><path d="M10 3V2H2v9h1"/></svg></button><button id="download" aria-label="Download feedback" title="Download feedback" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M8 1v9m-4-4 4 4 4-4M2 11v3h12v-3"/></svg></button></footer><textarea id="export" readonly aria-label="Feedback JSON"></textarea></main>
<script>
const data=DATA_JSON;
const $=id=>document.getElementById(id),key='echo-nano-existing-libraries-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(e){}
const order=['settings','files','library','play','musicsettings','shuffle','books','meditation'],rowsByIcon={},choices={};
for(const id of order){const old=Array.isArray(saved.icons)?saved.icons.find(i=>i.id===id):null;choices[id]=data.sets.some(s=>s.id===old?.choice)?old.choice:'keep-v6'}
function pixels(rows){let out='<svg class="pixel" width="20" height="16" viewBox="0 0 20 16" shape-rendering="crispEdges" aria-hidden="true"><rect width="20" height="16" fill="black"/>';rows.forEach((row,y)=>[...row].forEach((v,x)=>{if(v==='1')out+=`<rect x="${x}" y="${y}" width="1" height="1" fill="white"/>`}));return out+'</svg>'}
async function raster(icon){const img=new Image();img.src=icon.uri;await img.decode();const c=document.createElement('canvas');c.width=20;c.height=16;const ctx=c.getContext('2d');ctx.drawImage(img,2,0,16,16);const a=ctx.getImageData(0,0,20,16).data;return Array.from({length:16},(_,y)=>Array.from({length:20},(_,x)=>a[(y*20+x)*4+3]>=128?'1':'0').join(''))}
function render(){
 $('grid').innerHTML=order.map(id=>{const options=[{id:'keep-v6',name:'Previously approved',rows:data.current.find(i=>i.id===id).pixels},...data.sets.map(s=>({id:s.id,name:s.name,rows:rowsByIcon[s.id+':'+id]}))];return `<div class="row" role="group" aria-label="${data.labels[id]}">${options.map(o=>`<button data-icon="${id}" data-choice="${o.id}" aria-label="${data.labels[id]} — ${o.name}" title="${data.labels[id]} — ${o.name}" aria-pressed="${choices[id]===o.id}">${pixels(o.rows)}</button>`).join('')}</div>`}).join('');
}
function collect(){return {review:'Echo Nano existing icon libraries v1',scope:'Icons only. No navigation or firmware changes approved.',decision:'mixed',rendering:{canvas:[20,16],fit:[16,16],alpha_threshold:128,method:'Automatic browser raster preview; original SVG geometry unchanged'},icons:order.map(id=>{const choice=choices[id],s=data.sets.find(s=>s.id===choice),icon=s?.icons.find(i=>i.id===id);const old=Array.isArray(saved.icons)?saved.icons.find(i=>i.id===id):null;return {id,label:data.labels[id],choice,symbol:icon?.name||data.previous.icons.find(i=>i.id===id).symbol,source:icon?.source||null,sha256:icon?.sha256||null,preview_pixels:icon?rowsByIcon[s.id+':'+id]:data.current.find(i=>i.id===id).pixels,comment:typeof old?.comment==='string'?old.comment:''}}),general:typeof saved.general==='string'?saved.general:'',previous_feedback:data.previous}}
function save(){const f=collect();$('export').value=JSON.stringify(f,null,2);try{localStorage.setItem(key,JSON.stringify(f))}catch(e){}}
$('grid').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;choices[b.dataset.icon]=b.dataset.choice;document.querySelectorAll(`[data-icon="${b.dataset.icon}"]`).forEach(el=>el.setAttribute('aria-pressed',String(el===b)));save()});
$('copy').onclick=async()=>{save();try{await navigator.clipboard.writeText($('export').value);$('copy').style.color='#79d7b8';setTimeout(()=>$('copy').style.color='',1200)}catch(e){$('export').classList.add('visible');$('export').focus();$('export').select()}};
$('download').onclick=()=>{save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('export').value],{type:'application/json'}));a.download='echo-nano-existing-icon-feedback.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
window.reviewReady=Promise.all(data.sets.flatMap(s=>s.icons.map(async i=>{rowsByIcon[s.id+':'+i.id]=await raster(i)}))).then(()=>{render();save();$('copy').disabled=false;$('download').disabled=false;document.body.dataset.ready='true'}).catch(()=>{document.body.dataset.ready='error';$('export').classList.add('visible');$('export').value='Preview loading failed. Reload this page.'});
</script></html>
